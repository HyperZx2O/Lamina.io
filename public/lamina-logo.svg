<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-label="Lamina" role="img">
  <title>Lamina</title>
  <defs>
    <linearGradient id="laminaBook" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc4b2"/>
      <stop offset="1" stop-color="#c98ca7"/>
    </linearGradient>
    <linearGradient id="laminaL" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f7e9df" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="laminaSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7d6a0"/>
      <stop offset="0.55" stop-color="#f0c27a"/>
      <stop offset="1" stop-color="#f0c27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="laminaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
      <feOffset dx="0" dy="0.6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bottom page layer (slight tilt) -->
  <path d="M5.4 22.6 L5.4 10.4 Q5.4 8.8 6.9 8.5 L24.2 5.4 Q25.9 5.1 25.9 6.9 L25.9 19.2 Q25.9 20.8 24.4 21.1 L7.1 24.1 Q5.4 24.4 5.4 22.6 Z"
        fill="url(#laminaBook)" opacity="0.55"/>

  <!-- Top page / cover -->
  <path d="M7.6 24.4 L7.6 12.1 Q7.6 10.5 9.1 10.2 L25.6 7.2 Q27.2 6.9 27.2 8.6 L27.2 20.9 Q27.2 22.5 25.7 22.8 L9.2 25.8 Q7.6 26.1 7.6 24.4 Z"
        fill="url(#laminaBook)"/>

  <!-- Page edge lines (left side) -->
  <path d="M9.8 13.4 L9.8 22.6" stroke="#141110" stroke-opacity="0.18" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M11.4 12.9 L11.4 22.1" stroke="#141110" stroke-opacity="0.14" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M13.0 12.5 L13.0 21.6" stroke="#141110" stroke-opacity="0.10" stroke-width="0.6" stroke-linecap="round"/>

  <!-- The "L" / "ল" mark — a thin ascending stroke + horizontal base that doubles as a lamp post -->
  <g filter="url(#laminaShadow)">
    <path d="M14.4 11.2 L14.4 18.2 Q14.4 18.9 15.1 18.9 L20.8 18.9"
          stroke="url(#laminaL)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- The "spark" — knowledge is light -->
  <circle cx="20.8" cy="12.4" r="2.6" fill="url(#laminaSpark)" opacity="0.85"/>
  <circle cx="20.8" cy="12.4" r="0.9" fill="#fff8ea"/>
</svg>
